version: '3.8'

services:
  # Frontend UI (Nginx)
  frontend:
    image: 70madmax07/authapi-frontend:latest
    container_name: auth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth-service
    networks:
      - auth-network

  # Backend Auth Service (Node.js)
  auth-service:
    image: 70madmax07/authapi-auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5050:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - auth-network

  # Session / Rate-Limiting Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - auth_redis_data:/data
    networks:
      - auth-network

volumes:
  auth_redis_data:

networks:
  auth-network:
    driver: bridge